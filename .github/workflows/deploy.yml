name: Validate and deploy K-news
# Validation runs on every push to main and every pull request.
# Production deployment runs ONLY when the owner presses "Run workflow"
# (workflow_dispatch) on main in the GitHub Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: node --test src/components/ceo/timeline/*.test.mjs src/components/youtubeSummary.test.mjs server/statusReport.test.mjs server/opsHealth.test.mjs server/newsTitleKo.test.mjs server/wallstreet/*.test.mjs
      - run: node --import tsx --test server/sessionCompatibility.test.ts server/ceo/reportedHeadlines.test.ts server/ceo/koHeadlines.test.ts
      - name: CEO server tests
        shell: bash
        run: |
          fail=0
          # ceoStore.firestore 는 Firestore 에뮬레이터 전용(로컬에서 FIRESTORE_EMULATOR_HOST 설정 후 실행)이라 CI에서 제외
          for f in server/ceo/ceoHttp.test.ts server/ceo/ceoKo.test.ts server/ceo/ceoLive.test.ts server/ceo/ceoStatements.test.ts server/ceo/ceoSec.test.ts server/ceo/ceoPages.test.ts; do
            if ! node --import tsx --test "$f" > /tmp/t.txt 2>&1; then
              echo "::error title=$f::$(grep -E 'not ok|rror|xpected|actual' /tmp/t.txt | head -12 | tr '\n' ' ' | cut -c1-1500)"; fail=1
            fi
          done
          exit $fail
      - name: Monitoring / dedup integration tests
        timeout-minutes: 8
        shell: bash
        run: |
          if ! node --import tsx --import ./ops/css-stub.mjs server/monitoringAndDedup.test.ts > /tmp/m.txt 2>&1; then
            echo "::error title=monitoringAndDedup::$(grep -E 'not ok|rror|xpected|actual|✖|FAIL' /tmp/m.txt | head -15 | tr '\n' ' ' | cut -c1-1500)"; tail -40 /tmp/m.txt; exit 1
          fi
      - run: python3 -m unittest discover -s ops -p "test_*.py"
      - run: npm run build

  deploy:
    needs: validate
    if: github.repository == 'cocoadang/k-news' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: knews-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Build credential-free image
        run: docker build -t "asia-south1-docker.pkg.dev/gen-lang-client-0064554427/knews-images/k-news:${GITHUB_SHA}" .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/9298525505/locations/global/workloadIdentityPools/knews-github/providers/github-main
          service_account: knews-github-deploy@gen-lang-client-0064554427.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Push commit image
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker push "asia-south1-docker.pkg.dev/gen-lang-client-0064554427/knews-images/k-news:${GITHUB_SHA}"
      - name: Verify candidate then promote
        run: python3 ops/deploy.py
