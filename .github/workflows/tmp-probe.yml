name: tmp probe ceo sources
on:
  push:
    branches: [authored-10y]
    paths: [ops/probe-ceo-sources.ts, .github/workflows/tmp-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: PROBE=pershing-letters npx tsx ops/probe-ceo-sources.ts
      - run: PROBE=pershing-letters OLDEST=1 npx tsx ops/probe-ceo-sources.ts
